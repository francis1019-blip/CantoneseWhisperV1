name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper==1.2.1
          pip install opencc-python-reimplemented
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name CantoneseWhisper cantonese_whisper_gui_modern.py

      - name: Create ZIP
        run: |
          Compress-Archive -Path dist\CantoneseWhisper -DestinationPath CantoneseWhisper-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CantoneseWhisper-Windows
          path: CantoneseWhisper-Windows.zip
